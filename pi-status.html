<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Raspberry Pi System Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #111;
      color: #eee;
      font-family: system-ui, Arial, sans-serif;
    }

    h2 {
      margin-top: 0;
      color: #7dd3fc;
    }

    #current {
      margin: 12px 0 20px 0;
      padding: 10px;
      background: #1f2933;
      border-radius: 6px;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    canvas {
      background: #0b1220;
      border-radius: 8px;
      padding: 10px;
    }
  </style>
</head>

<body>

<h2>📊 Raspberry Pi Health Monitor</h2>

<div id="current">Loading…</div>

<div class="grid">
  <canvas id="usageChart"></canvas>
  <canvas id="tempChart"></canvas>
</div>

<script>
let usageChart, tempChart

function formatTime(ts) {
  const d = new Date(ts)
  return d.toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  })
}

const commonDatasetStyle = {
  tension: 0.3,
  pointRadius: 2,
  pointHoverRadius: 6,
  pointHitRadius: 10,
  borderWidth: 2
}

const commonChartOptions = {
  responsive: true,
  animation: false,
  interaction: {
    mode: 'index',
    intersect: false
  },
  plugins: {
    tooltip: {
      enabled: true
    },
    legend: {
      display: true
    }
  }
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats')
    const data = await res.json()
    if (!data.length) return

    const labels = data.map(r => formatTime(r.timestamp))
    const cpuUsage = data.map(r => Number(r.cpu_usage_percent))
    const ramUsage = data.map(r => Number(r.ram_percent))
    const temps    = data.map(r => Number(r.cpu_temp))

    const latest = data[data.length - 1]

    document.getElementById('current').innerHTML = `
      🌡 <b>${latest.cpu_temp}°C</b>
      &nbsp; | &nbsp;
      🧠 CPU <b>${latest.cpu_usage_percent}%</b>
      &nbsp; | &nbsp;
      💾 RAM <b>${latest.ram_percent}%</b>
      &nbsp; | &nbsp;
      ⚡ Throttle <b>${latest.throttled_flags}</b>
    `

    // CPU + RAM usage (combined)
    if (!usageChart) {
      usageChart = new Chart(document.getElementById('usageChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'CPU Usage (%)',
              data: cpuUsage,
              borderColor: 'rgb(249, 115, 22)',
              ...commonDatasetStyle
            },
            {
              label: 'RAM Usage (%)',
              data: ramUsage,
              borderColor: 'rgb(34, 197, 94)',
              ...commonDatasetStyle
            }
          ]
        },
        options: {
          ...commonChartOptions,
          scales: {
            x: {
              title: { display: true, text: 'Time' }
            },
            y: {
              beginAtZero: true,
              max: 100,
              title: { display: true, text: 'Usage (%)' }
            }
          }
        }
      })
    } else {
      usageChart.data.labels = labels
      usageChart.data.datasets[0].data = cpuUsage
      usageChart.data.datasets[1].data = ramUsage
      usageChart.update()
    }

    // CPU temperature (separate)
    if (!tempChart) {
      tempChart = new Chart(document.getElementById('tempChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'CPU Temperature (°C)',
            data: temps,
              borderColor: 'rgb(239, 68, 68)',
              ...commonDatasetStyle
          }]
        },
        options: {
          ...commonChartOptions,
          scales: {
            x: {
              title: { display: true, text: 'Time' }
            },
            y: {
              beginAtZero: true,
              title: { display: true, text: '°C' }
            }
          }
        }
      })
    } else {
      tempChart.data.labels = labels
      tempChart.data.datasets[0].data = temps
      tempChart.update()
    }

  } catch (err) {
    console.error('Failed to load stats', err)
  }
}

loadStats()
setInterval(loadStats, 5000)
</script>

</body>
</html>
